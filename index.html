<!DOCTYPE html>
<html>
<head>
    <title>SpudWorks Python Course</title>
    <style>
        /* Strip margins so the notebook fills the screen completely */
        body { margin: 0; overflow: hidden; background-color: #f5f5f5; }
        iframe { width: 100vw; height: 100vh; border: none; display: block; }
    </style>
</head>
<body>

    <!-- The iframe where JupyterLite will actually run -->
    <iframe id="jupyter-frame" src=""></iframe>

    <script>
        // 1. Grab everything after the '#' in the URL
        const hashPath = window.location.hash.substring(1);

        // 2. Point to your JupyterLite Retro/Document UI
        // Note: Adjust '/retro/notebooks/' if your JupyterLite build puts it elsewhere
        const jupyterBaseUrl = "/Python_Fundamentals_2026/retro/notebooks/?path=";

        // 3. Inject the notebook path into the iframe
        const frame = document.getElementById('jupyter-frame');
        
        if (hashPath) {
            // If they provided a hash, load that specific notebook
            frame.src = jupyterBaseUrl + hashPath;
        } else {
            // Fallback: If no hash is provided, load the introduction
            frame.src = jupyterBaseUrl + "01_Fundamentals/01.1_Outputting.ipynb";
        }
    </script>
</body>
</html>
